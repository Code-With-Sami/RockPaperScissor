<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Rock Paper Scissor - Game</title>
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        <h2>Rock Paper Scissor</h2>
        <div class="playersCont">
            <div class="player">
                <h3>Player</h3>
                <span class="playerScore score">0</span>
            </div>
            <div class="compter">
                <h3>Computer</h3>
                <span class="computerScore score">0</span>
            </div>
        </div>
        <div class="moveCont">
                <h2 class="moverHeading">Choose your Move</h2>
                <span class="movesLeft">Moves left : 10</span>
        </div>
        <div class="btnsCont">
            <button class="btn rockBtn">Rock</button>
            <button class="btn paperBtn">Paper</button>
            <button class="btn scissorBtn">scissor</button>
        </div>
        <div class="resultCont">
            <span class="result">Player Won</span>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
